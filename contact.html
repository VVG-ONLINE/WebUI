<body>
  <system-panel></system-panel>

  <page-header
    user-tag="GET_IN_TOUCH"
    path-tag="LETS_BUILD"
    title="Let's Transform Together"
    subtitle="Ready to drive your business beyond growth? Reach out and we'll craft your roadmap."
  ></page-header>

  <section class="container py-5" aria-labelledby="contact-form-heading">
    <h2 id="contact-form-heading" class="visually-hidden">Contact Form</h2>
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <form id="contact-form" class="p-4 border">
          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="contact-name" class="form-label mono small">NAME</label>
              <input type="text" class="form-control border-0 border-bottom rounded-0" id="contact-name" required>
            </div>
            <div class="col-md-6 mb-3">
              <label for="contact-email" class="form-label mono small">EMAIL</label>
              <input type="email" class="form-control border-0 border-bottom rounded-0" id="contact-email" required>
            </div>
          </div>
          <div class="mb-3">
            <label for="contact-subject" class="form-label mono small">SUBJECT</label>
            <input type="text" class="form-control border-0 border-bottom rounded-0" id="contact-subject">
          </div>
          <div class="mb-3">
            <label for="contact-message" class="form-label mono small">MESSAGE</label>
            <textarea class="form-control border-0 border-bottom rounded-0" id="contact-message" rows="6" required></textarea>
          </div>
          <button type="submit" class="btn btn-vvg w-100">Send Message</button>
        </form>
      </div>
    </div>
  </section>

  <app-footer></app-footer>
  <ai-terminal></ai-terminal>
  <div id="canvas-container" aria-hidden="true"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
