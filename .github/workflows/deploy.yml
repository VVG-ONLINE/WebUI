# ============================================================================
# GitHub Actions CI/CD — builds the Blazor WASM app and deploys to GitHub Pages
#
# Trigger: every push to the "main" branch
# Output:  the gh-pages branch is updated with compiled static files
#
# Steps:
#   1. Checkout repo (with Git LFS for large files like ONNX model)
#   2. Install .NET SDK 10.0.101
#   3. dotnet publish → release/
#   4. Fix <base href> for custom domain vs. GitHub Pages subpath
#   5. Generate blog-index.json from Markdown YAML frontmatter (Node script)
#   6. Copy blog index + .md files to release output
#   7. Create .nojekyll + SPA 404.html + CNAME
#   8. Deploy to gh-pages branch (JamesIves/github-pages-deploy-action)
# ============================================================================
name: Deploy VVG System to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.101'

      - name: Clean Build Artifacts
        run: dotnet clean src/VVG.Web.csproj -c Release

      - name: Publish Project
        run: dotnet publish src/VVG.Web.csproj -c Release -o release /p:StaticWebAssetBasePath=/ --nologo

      - name: Fix Base Href for GitHub Pages
        run: |
          if [ -f "CNAME" ]; then
            echo "✅ Custom domain detected - keeping base href as /"
          else
            echo "⚠️ No CNAME - setting base href to /WebUI/ for GitHub Pages subpath"
            sed -i 's|<base href="/">|<base href="/WebUI/">|g' release/wwwroot/index.html
            sed -i "s|navigator.serviceWorker.register('service-worker.js'|navigator.serviceWorker.register('/WebUI/service-worker.js'|g" release/wwwroot/index.html
          fi

      - name: Generate Blog Index
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');

          const blogDir = 'src/wwwroot/assets/data/blogs';
          const outputFile = 'src/wwwroot/assets/data/json/blog-index.json';

          const posts = [];

          fs.mkdirSync(path.dirname(outputFile), { recursive: true });

          if (fs.existsSync(blogDir)) {
            fs.readdirSync(blogDir).forEach(file => {
              if (file.endsWith('.md')) {
                const content = fs.readFileSync(path.join(blogDir, file), 'utf8');
                const frontMatterMatch = content.match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/);

                if (frontMatterMatch) {
                  const frontMatter = frontMatterMatch[1];
                  const markdownContent = frontMatterMatch[2] || '';
                  const post = {};

                  frontMatter.split('\n').forEach(line => {
                    const match = line.match(/^(\w+):\s*(.+)$/);
                    if (match) {
                      const [, key, value] = match;

                      if (value.trim().startsWith('[')) {
                        try {
                          post[key] = JSON.parse(value.replace(/'/g, '\"'));
                        } catch {
                          post[key] = [];
                        }
                      }
                      else if (value.trim() === 'true' || value.trim() === 'false') {
                        post[key] = value.trim() === 'true';
                      }
                      else if (!isNaN(value.trim())) {
                        post[key] = parseInt(value.trim());
                      }
                      else {
                        post[key] = value.replace(/^[\x22']|[\x22']$/g, '').trim();
                      }
                    }
                  });

                  post.filename = file.replace('.md', '');

                  // Calculate timeToRead (equivalent to C# Indexer: wordCount / 200)
                  const wordCount = (markdownContent.match(/[\w-]+/g) || []).length;
                  post.timeToRead = Math.ceil(wordCount / 200);

                  posts.push(post);
                }
              }
            });
          }

          fs.writeFileSync(outputFile, JSON.stringify(posts, null, 2));
          console.log('✅ Generated blog index with ' + posts.length + ' posts');
          "

      - name: Copy Blog Index to Release
        run: |
          mkdir -p release/wwwroot/assets/data/json
          cp src/wwwroot/assets/data/json/blog-index.json release/wwwroot/assets/data/json/

      - name: Copy Markdown Files to Release
        run: |
          echo "📝 Copying markdown blog files..."
          mkdir -p release/wwwroot/assets/data/blogs

          if [ -d "src/wwwroot/assets/data/blogs" ]; then
            cp -v src/wwwroot/assets/data/blogs/*.md release/wwwroot/assets/data/blogs/
            echo "✅ Markdown files copied successfully"
            echo "Files in release:"
            ls -la release/wwwroot/assets/data/blogs/
          else
            echo "❌ Source directory not found: src/wwwroot/assets/data/blogs"
            exit 1
          fi

      - name: Verify Deployment Files
        run: |
          echo "=== 📁 Checking deployment structure ==="
          echo ""
          echo "Root files:"
          ls -la release/wwwroot/ | head -20
          echo ""
          echo "JSON data folder:"
          ls -la release/wwwroot/assets/data/json/ || echo "❌ json folder not found"
          echo ""
          echo "Blog markdown files:"
          ls -la release/wwwroot/assets/data/blogs/ || echo "❌ blogs folder not found"
          echo ""
          echo "File count:"
          echo "  - MD files: $(find release/wwwroot/assets/data/blogs/ -name '*.md' 2>/dev/null | wc -l)"
          echo "  - JSON files: $(find release/wwwroot/assets/data/json/ -name '*.json' 2>/dev/null | wc -l)"

      - name: Prepare GitHub Pages Artifacts
        run: |
          # Ensure folders starting with '_' are served
          touch release/wwwroot/.nojekyll

          # Create 404.html for SPA routing on GitHub Pages
          if [ -f "CNAME" ]; then
            # Custom domain - root path
            printf '<!DOCTYPE html>\n<html>\n<head>\n    <script>\n        var path = window.location.pathname;\n        var redirect = "/?" + encodeURIComponent(path + window.location.search + window.location.hash);\n        window.location.replace(redirect);\n    </script>\n</head>\n<body>Redirecting...</body>\n</html>\n' > release/wwwroot/404.html
            echo "✅ 404.html created for custom domain (root path)"
          else
            # GitHub Pages subpath
            printf '<!DOCTYPE html>\n<html>\n<head>\n    <script>\n        var path = window.location.pathname;\n        var redirect = "/WebUI/?" + encodeURIComponent(path + window.location.search + window.location.hash);\n        window.location.replace(redirect);\n    </script>\n</head>\n<body>Redirecting...</body>\n</html>\n' > release/wwwroot/404.html
            echo "✅ 404.html created for GitHub Pages subpath (/WebUI/)"
          fi

          # Copy CNAME if it exists (for custom domain)
          if [ -f "CNAME" ]; then
            cp CNAME release/wwwroot/CNAME
            echo "✅ CNAME copied"
          fi

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: release/wwwroot
          branch: gh-pages
          clean: true
