name: Deploy VVG System to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.101'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore dependencies
        run: dotnet restore src/VVG.Web.csproj

      - name: Build
        run: dotnet build src/VVG.Web.csproj -c Release --no-restore

      - name: Run Tests
        run: dotnet test tests/VVG.Web.Tests/VVG.Web.Tests.csproj -c Release --no-build --verbosity normal

      - name: Publish Project
        run: dotnet publish src/VVG.Web.csproj -c Release -o release /p:StaticWebAssetBasePath=/WebUI/ --nologo

      - name: Fix Service Worker Base Path
        run: |
          # Replace base path in service-worker.js for GitHub Pages
          if [ -f "release/wwwroot/WebUI/service-worker.js" ]; then
            sed -i 's|const base = "/";|const base = "/WebUI/";|g' release/wwwroot/WebUI/service-worker.js
            echo "✅ Fixed service-worker.js base path"
          fi

      - name: Generate Blog Index
        run: |
          cat > generate-blog-index.js << 'EOF'
          const fs = require('fs');
          const path = require('path');
          
          const blogDir = 'src/wwwroot/assets/data/blogs';
          const outputFile = 'release/wwwroot/WebUI/data/blog-index.json';
          
          const posts = [];
          
          fs.mkdirSync(path.dirname(outputFile), { recursive: true });
          
          if (fs.existsSync(blogDir)) {
            fs.readdirSync(blogDir).forEach(file => {
              if (file.endsWith('.md')) {
                const content = fs.readFileSync(path.join(blogDir, file), 'utf8');
                const frontMatterMatch = content.match(/^---\n([\s\S]*?)\n---/);
                
                if (frontMatterMatch) {
                  const frontMatter = frontMatterMatch[1];
                  const post = {};
                  
                  frontMatter.split('\n').forEach(line => {
                    const match = line.match(/^(\w+):\s*(.+)$/);
                    if (match) {
                      const [, key, value] = match;
                      if (value.trim().startsWith('[')) {
                        try {
                          post[key] = JSON.parse(value.replace(/'/g, '"'));
                        } catch {
                          post[key] = [];
                        }
                      }
                      else if (value.trim() === 'true' || value.trim() === 'false') {
                        post[key] = value.trim() === 'true';
                      }
                      else if (!isNaN(value.trim())) {
                        post[key] = parseInt(value.trim());
                      }
                      else {
                        post[key] = value.replace(/^["']|["']$/g, '').trim();
                      }
                    }
                  });
                  
                  post.filename = file.replace('.md', '');
                  posts.push(post);
                }
              }
            });
          }
          
          fs.writeFileSync(outputFile, JSON.stringify(posts, null, 2));
          console.log(`✅ Generated blog index with ${posts.length} posts`);
          EOF
          
          node generate-blog-index.js

      - name: Copy Markdown Files to Release
        run: |
          echo "📝 Copying markdown blog files..."
          mkdir -p release/wwwroot/WebUI/assets/data/blogs
          
          if [ -d "src/wwwroot/assets/data/blogs" ]; then
            cp -v src/wwwroot/assets/data/blogs/*.md release/wwwroot/WebUI/assets/data/blogs/
            echo "✅ Markdown files copied successfully"
          else
            echo "❌ Source directory not found"
            exit 1
          fi

      - name: Verify Deployment Files
        run: |
          echo "=== 📁 Checking deployment structure ==="
          ls -la release/wwwroot/WebUI/ | head -20
          echo ""
          echo "_framework:"
          ls release/wwwroot/WebUI/_framework/ | head -5
          echo ""
          echo "Blog files:"
          ls release/wwwroot/WebUI/assets/data/blogs/ 2>/dev/null | head -5 || echo "none"

      - name: Prepare GitHub Pages Artifacts
        run: |
          # Ensure folders starting with '_' are served
          touch release/wwwroot/WebUI/.nojekyll
          
          # Fix base href for GitHub Pages
          sed -i 's|<base href="/">|<base href="/WebUI/">|g' release/wwwroot/WebUI/index.html
          echo "✅ Fixed base href to /WebUI/"
          
          # Copy 404.html for SPA routing
          if [ -f "release/wwwroot/WebUI/404.html" ]; then
            echo "✅ 404.html exists"
          else
            cp release/wwwroot/WebUI/index.html release/wwwroot/WebUI/404.html
          fi
          
          # Copy CNAME if it exists
          if [ -f "CNAME" ]; then
            cp CNAME release/wwwroot/WebUI/CNAME
          fi

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: release/wwwroot/WebUI
          branch: gh-pages
          clean: true
