# ============================================================================
# GitHub Actions CI/CD — builds the Blazor WASM app and deploys to GitHub Pages
#
# Trigger: every push to the "main" branch
# Output:  the gh-pages branch is updated with compiled static files
#
# Steps:
#   1. Checkout repo (with Git LFS for large files like ONNX model)
#   2. Install .NET SDK 10.0.101
#   3. dotnet publish → release/
#   4. Fix <base href> for custom domain vs. GitHub Pages subpath
#   5. Generate blog-index.json from Markdown YAML frontmatter (Node script)
#   6. Copy blog index + .md files to release output
#   7. Create .nojekyll + SPA 404.html + CNAME
#   8. Deploy to gh-pages branch (JamesIves/github-pages-deploy-action)
# ============================================================================
name: Deploy VVG System to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.101'

      - name: Clean Build Artifacts
        run: dotnet clean src/VVG.Web.csproj -c Release

      - name: Install Sass
        run: npm install -g sass

      - name: Publish Project
        run: dotnet publish src/VVG.Web.csproj -c Release -o release /p:StaticWebAssetBasePath=/ --nologo

      - name: Install Fonts & Generate Twitter Cards
        run: |
          sudo apt-get update
          sudo apt-get install -y fontconfig fonts-ebgaramond fonts-firacode fonts-ibm-plex
          dotnet run --project tools/TwitterCardGenerator

      - name: Fix Base Href for GitHub Pages
        run: |
          if [ -f "CNAME" ]; then
            echo "✅ Custom domain detected - keeping base href as /"
          else
            echo "⚠️ No CNAME - setting base href to /WebUI/ for GitHub Pages subpath"
            sed -i 's|<base href="/">|<base href="/WebUI/">|g' release/wwwroot/index.html
            sed -i "s|navigator.serviceWorker.register('service-worker.js'|navigator.serviceWorker.register('/WebUI/service-worker.js'|g" release/wwwroot/index.html
          fi

      - name: Generate Blog Index
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');

          const blogDir = 'src/wwwroot/assets/data/blogs';
          const outputFile = 'src/wwwroot/assets/data/json/blog-index.json';

          const posts = [];

          fs.mkdirSync(path.dirname(outputFile), { recursive: true });

          if (fs.existsSync(blogDir)) {
            fs.readdirSync(blogDir).forEach(file => {
              if (file.endsWith('.md')) {
                const content = fs.readFileSync(path.join(blogDir, file), 'utf8');
                const frontMatterMatch = content.match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/);

                if (frontMatterMatch) {
                  const frontMatter = frontMatterMatch[1];
                  const markdownContent = frontMatterMatch[2] || '';
                  const post = {};

                  frontMatter.split('\n').forEach(line => {
                    const match = line.match(/^(\w+):\s*(.+)$/);
                    if (match) {
                      const [, key, value] = match;

                      if (value.trim().startsWith('[')) {
                        try {
                          post[key] = JSON.parse(value.replace(/'/g, '\"'));
                        } catch {
                          post[key] = [];
                        }
                      }
                      else if (value.trim() === 'true' || value.trim() === 'false') {
                        post[key] = value.trim() === 'true';
                      }
                      else if (!isNaN(value.trim())) {
                        post[key] = parseInt(value.trim());
                      }
                      else {
                        post[key] = value.replace(/^[\x22']|[\x22']$/g, '').trim();
                      }
                    }
                  });

                  post.filename = file.replace('.md', '');

                  // Calculate timeToRead (equivalent to C# Indexer: wordCount / 200)
                  const wordCount = (markdownContent.match(/[\w-]+/g) || []).length;
                    post.timeToRead = Math.ceil(wordCount / 200);
                    if (post.draft === true) return;
                    posts.push(post);
                }
              }
            });
          }

          fs.writeFileSync(outputFile, JSON.stringify(posts, null, 2));
          console.log('✅ Generated blog index with ' + posts.length + ' posts');
          "

      - name: Copy Blog Index to Release
        run: |
          mkdir -p release/wwwroot/assets/data/json
          cp src/wwwroot/assets/data/json/blog-index.json release/wwwroot/assets/data/json/

      - name: Generate Static Meta HTML for SEO
        run: |
          cat > generate-meta.js << 'SCRIPT_EOF'
          const fs = require('fs');
          const path = require('path');

          const BASE_URL = 'https://vvgonline.net';
          const DEFAULT_IMAGE = BASE_URL + '/assets/images/twitter-cards/vvg-online-home-twitter-card.png';
          const SITE_NAME = 'VVG ONLINE';
          const TWITTER_SITE = '@vvgonline';

          const blogIndex = JSON.parse(fs.readFileSync('src/wwwroot/assets/data/json/blog-index.json', 'utf8'));

          // Read card-mapping.json for per-page image resolution
          const cardMappingPath = 'src/wwwroot/assets/images/twitter-cards/card-mapping.json';
          const cardMapping = fs.existsSync(cardMappingPath)
            ? JSON.parse(fs.readFileSync(cardMappingPath, 'utf8'))
            : {};

          function getImageUrl(slug) {
            var file = cardMapping[slug] || (slug + '-twitter-card.png');
            return BASE_URL + '/assets/images/twitter-cards/' + file;
          }

          const pages = {
            'contact': {
              dir: 'contact',
              title: 'Contact Us - VVG ONLINE',
              description: "Get in touch with VVG ONLINE for digital business consulting. Let's start a conversation about your vision and digital transformation goals.",
              type: 'website',
              image: getImageUrl('contact')
            },
            'services': {
              dir: 'services',
              title: 'Our Services - VVG ONLINE',
              description: 'Comprehensive digital business consulting services including technology solutions, digital marketing, data analytics, UX design, and customized strategies.',
              type: 'website',
              image: getImageUrl('services')
            },
            'about': {
              dir: 'about',
              title: 'About VVG ONLINE',
              description: "Learn about VVG ONLINE's mission, philosophy, and our commitment to driving digital transformation and innovation.",
              type: 'website',
              image: getImageUrl('about')
            },
            'blog': {
              dir: 'blog',
              title: 'Blog - VVG ONLINE | Digital Insights & Expertise',
              description: 'Explore insights on digital transformation, business strategy, technology innovation, and leadership from VVG ONLINE experts.',
              type: 'website',
              image: getImageUrl('blog')
            },
            'blog-archives': {
              dir: 'blog-archives',
              title: 'Blog Archives - VVG ONLINE',
              description: 'Browse all articles from VVG ONLINE covering digital business consulting, technology, and innovation.',
              type: 'website',
              image: getImageUrl('blog-archives')
            },
            'pricing': {
              dir: 'pricing',
              title: 'Pricing - VVG ONLINE',
              description: "Transparent pricing for VVG ONLINE's digital consulting services. Explore our tiered packages, service-level pricing, and custom bundles for strategy, marketing, IT, and design thinking.",
              type: 'website',
              image: getImageUrl('pricing')
            }
          };

          function generateMetaHTML(pageUrl, title, description, type, image, articleMeta, isRoot) {
            const url = BASE_URL + (pageUrl ? '/' + pageUrl : '');
            const articleTags = articleMeta ? (articleMeta.tags || []) : [];
            const prefix = isRoot ? '' : '../';

            let articleMetaHTML = '';
            if (articleMeta && articleMeta.publishedTime) {
              articleMetaHTML += '    <meta property="article:published_time" content="' + articleMeta.publishedTime + '" />\n';
            }
            if (articleMeta && articleMeta.section) {
              articleMetaHTML += '    <meta property="article:section" content="' + articleMeta.section + '" />\n';
            }
            articleTags.forEach(function(tag) {
              articleMetaHTML += '    <meta property="article:tag" content="' + tag + '" />\n';
            });

            return '<!DOCTYPE html>\n' +
            '<html lang="en-in">\n' +
            '<head>\n' +
            '    <meta charset="utf-8" />\n' +
            '    <meta name="viewport" content="width=device-width, initial-scale=1.0" />\n' +
            '    <title>' + title + '</title>\n' +
            '    <meta name="description" content="' + description + '" />\n' +
            '    <meta name="author" content="' + SITE_NAME + '" />\n' +
            '    <meta itemprop="name" content="' + title + '" />\n' +
            '    <meta itemprop="description" content="' + description + '" />\n' +
            '    <meta itemprop="image" content="' + image + '" />\n' +
            '    <meta property="og:url" content="' + url + '" />\n' +
            '    <meta property="og:type" content="' + type + '" />\n' +
            '    <meta property="og:title" content="' + title + '" />\n' +
            '    <meta property="og:description" content="' + description + '" />\n' +
            '    <meta property="og:image" content="' + image + '" />\n' +
            '    <meta property="og:site_name" content="' + SITE_NAME + '" />\n' +
            articleMetaHTML +
            '    <meta name="twitter:card" content="summary_large_image" />\n' +
            '    <meta name="twitter:title" content="' + title + '" />\n' +
            '    <meta name="twitter:description" content="' + description + '" />\n' +
            '    <meta name="twitter:image" content="' + image + '" />\n' +
            '    <meta name="twitter:site" content="' + TWITTER_SITE + '" />\n' +
            '    <base href="/" />\n' +
            '    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;600&display=swap" rel="stylesheet">\n' +
            '    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">\n' +
            '    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">\n' +
            '    <link rel="stylesheet" href="' + prefix + 'assets/css/app.css" />\n' +
            '    <link rel="icon" type="image/png" href="' + prefix + 'assets/images/profiles/logo-2025.svg" />\n' +
            '    <link href="' + prefix + 'VVG.Web.styles.css" rel="stylesheet" />\n' +
            '    <link href="' + prefix + 'manifest.webmanifest" rel="manifest" />\n' +
            '</head>\n' +
            '<body>\n' +
            '    <div id="app"><div class="preloader"><div class="loading-box"><div class="loader"></div><div class="terminal-output msg-1">_</div><div class="terminal-output msg-2">SYSTEM BOOTING...</div></div></div></div>\n' +
            '    <script>\n' +
            '        var path = window.location.pathname;\n' +
            '        if (path !== "/" && path !== "/index.html") {\n' +
            '            window.location.replace("/?" + encodeURIComponent(path + window.location.search + window.location.hash));\n' +
            '        }\n' +
            '    </script>\n' +
            '</body>\n' +
            '</html>';
          }

          Object.entries(pages).forEach(function(entry) {
            const key = entry[0];
            const page = entry[1];
            const dir = page.dir ? 'release/wwwroot/' + page.dir : 'release/wwwroot';
            fs.mkdirSync(dir, { recursive: true });

            const isRoot = !page.dir;
            const html = generateMetaHTML(key, page.title, page.description, page.type, page.image, {}, isRoot);
            fs.writeFileSync(path.join(dir, 'index.html'), html);
            console.log('Generated: ' + (page.dir || '/') + '/index.html');
          });

          blogIndex.forEach(function(post) {
            if (post.draft) return;

            const slug = post.slug;
            const dir = 'release/wwwroot/blog/' + slug;
            fs.mkdirSync(dir, { recursive: true });

            const publishedTime = post.publishedAt ? new Date(post.publishedAt).toISOString() : '';
            const articleMeta = {
              publishedTime: publishedTime,
              section: post.category || '',
              tags: post.tags || []
            };

            const imageUrl = getImageUrl(slug);

            const html = generateMetaHTML(
              'blog/' + slug,
              post.title + ' - VVG ONLINE',
              post.excerpt || '',
              'article',
              imageUrl,
              articleMeta,
              false
            );
            fs.writeFileSync(path.join(dir, 'index.html'), html);
            console.log('Generated: blog/' + slug + '/index.html');
          });

          console.log('Generated static meta HTML for ' + Object.keys(pages).length + ' pages + ' + blogIndex.filter(function(p) { return !p.draft; }).length + ' blog posts');
          SCRIPT_EOF
          node generate-meta.js

      - name: Copy Markdown Files to Release
        run: |
          echo "📝 Copying markdown blog files..."
          mkdir -p release/wwwroot/assets/data/blogs

          if [ -d "src/wwwroot/assets/data/blogs" ]; then
            cp -v src/wwwroot/assets/data/blogs/*.md release/wwwroot/assets/data/blogs/
            echo "✅ Markdown files copied successfully"
            echo "Files in release:"
            ls -la release/wwwroot/assets/data/blogs/
          else
            echo "❌ Source directory not found: src/wwwroot/assets/data/blogs"
            exit 1
          fi

      - name: Verify Deployment Files
        run: |
          echo "=== 📁 Checking deployment structure ==="
          echo ""
          echo "Root files:"
          ls -la release/wwwroot/ | head -20
          echo ""
          echo "JSON data folder:"
          ls -la release/wwwroot/assets/data/json/ || echo "❌ json folder not found"
          echo ""
          echo "Blog markdown files:"
          ls -la release/wwwroot/assets/data/blogs/ || echo "❌ blogs folder not found"
          echo ""
          echo "File count:"
          echo "  - MD files: $(find release/wwwroot/assets/data/blogs/ -name '*.md' 2>/dev/null | wc -l)"
          echo "  - JSON files: $(find release/wwwroot/assets/data/json/ -name '*.json' 2>/dev/null | wc -l)"

      - name: Prepare GitHub Pages Artifacts
        run: |
          # Ensure folders starting with '_' are served
          touch release/wwwroot/.nojekyll

          # Create 404.html for SPA routing on GitHub Pages
          if [ -f "CNAME" ]; then
            # Custom domain - root path
            printf '<!DOCTYPE html>\n<html>\n<head>\n    <script>\n        var path = window.location.pathname;\n        var redirect = "/?" + encodeURIComponent(path + window.location.search + window.location.hash);\n        window.location.replace(redirect);\n    </script>\n</head>\n<body>Redirecting...</body>\n</html>\n' > release/wwwroot/404.html
            echo "✅ 404.html created for custom domain (root path)"
          else
            # GitHub Pages subpath
            printf '<!DOCTYPE html>\n<html>\n<head>\n    <script>\n        var path = window.location.pathname;\n        var redirect = "/WebUI/?" + encodeURIComponent(path + window.location.search + window.location.hash);\n        window.location.replace(redirect);\n    </script>\n</head>\n<body>Redirecting...</body>\n</html>\n' > release/wwwroot/404.html
            echo "✅ 404.html created for GitHub Pages subpath (/WebUI/)"
          fi

          # Copy CNAME if it exists (for custom domain)
          if [ -f "CNAME" ]; then
            cp CNAME release/wwwroot/CNAME
            echo "✅ CNAME copied"
          fi

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: release/wwwroot
          branch: gh-pages
          clean: true
